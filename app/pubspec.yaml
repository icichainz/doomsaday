name: doomsaday
description: "Doomsaday — manage Docker on remote servers through the agent REST API."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  # SHA-256 of the agent certificate's DER bytes, for the pin.
  crypto: ^3.0.6
  # The device key never touches shared_preferences.
  flutter_secure_storage: ^9.2.4
  # The real biometric prompt behind X-Confirmed: biometric, and the app lock.
  local_auth: ^2.3.0
  # Preferences > About reads the version from the platform bundle rather than
  # repeating the pubspec's here.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  # The integration test pairs against a real agent over TLS.
  test: ^1.25.15

flutter:
  uses-material-design: true

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500

# The launcher icons are per flavor, in flutter_launcher_icons-free.yaml and
# flutter_launcher_icons-pro.yaml. Regenerate the artwork with
# `python3 tool/generate_icon.py`, then cut it with
# `dart run flutter_launcher_icons`, which picks both files up on its own.

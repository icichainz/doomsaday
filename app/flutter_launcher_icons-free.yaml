# The free flavor's launcher icons: mint mark on the app's dark ground.
#
# Regenerate the artwork first with `python3 tool/generate_icon.py`, then run
# `dart run flutter_launcher_icons`, which reads this file and its pro twin and
# writes android/app/src/free/res and the AppIcon-free asset catalogs.
#
# macos is generated by tool/generate_icon.py instead: this package's macOS
# generator ignores the flavor and would write both editions over one
# AppIcon.appiconset.
flutter_launcher_icons:
  image_path: assets/icon/free/app_icon.png
  android: true
  adaptive_icon_background: "#0E1417"
  adaptive_icon_foreground: assets/icon/free/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: false

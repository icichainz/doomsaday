# The pro flavor's launcher icons: ivory mark on deep red, same geometry.
#
# Regenerate the artwork first with `python3 tool/generate_icon.py`, then run
# `dart run flutter_launcher_icons`, which reads this file and its free twin and
# writes android/app/src/pro/res and the AppIcon-pro asset catalogs.
#
# macos is generated by tool/generate_icon.py instead: this package's macOS
# generator ignores the flavor and would write both editions over one
# AppIcon.appiconset.
flutter_launcher_icons:
  image_path: assets/icon/pro/app_icon.png
  android: true
  adaptive_icon_background: "#9E1B1B"
  adaptive_icon_foreground: assets/icon/pro/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Containers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1417; color: #E8EEF0;">
<main style="flex-grow: 1; box-sizing: border-box; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px;">
<header style="display: flex; align-items: center; gap: 12px;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Containers</h1>
<div style="font-size: 13px; color: #9AAAB1;">prod-eu-1</div>
</div>
<button type="button" aria-label="Search containers" style="width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #1A2429; border: 1px solid #2A363C; color: #E8EEF0;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
</button>
</header>

<div role="group" aria-label="Filter by state" style="display: flex; gap: 8px;">
<sc-for list="{{chips}}" as="chip" hint-placeholder-count="3">
<button type="button" onClick="{{chip.pick}}" aria-pressed="{{chip.pressed}}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.fg}}; font-size: 14px; font-weight: 600;">{{chip.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #161E22; border: 1px solid #243036; padding: 0 6px 0 16px;">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 8px; min-height: 66px; border-bottom: 1px solid {{row.divider}};">
<a href="ContainerDetail.dc.html" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 66px; color: #E8EEF0;">
<span style="flex-shrink: 0; width: 10px; height: 10px; border-radius: 5px; background: {{row.color}};"></span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 15px; font-weight: 600;">{{row.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AAAB1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.image}}</span>
</span>
<span style="flex-grow: 1;"></span>
<span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px;">
<span style="font-size: 12px; font-weight: 600; color: {{row.color}};">{{row.state}}</span>
<span style="font-size: 12px; color: #9AAAB1;">{{row.meta}}</span>
</span>
</a>
<sc-if value="{{row.isRunning}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{row.actionLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #9AAAB1;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
</button>
</sc-if>
<sc-if value="{{row.isStopped}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="{{row.actionLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #5BE3B0;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"></path></svg>
</button>
</sc-if>
</div>
</sc-for>
</div>
</main>

<nav aria-label="Primary" style="display: flex; height: 76px; box-sizing: border-box; padding: 8px 6px 12px; background: #121A1E; border-top: 1px solid #243036;">
<a href="Dashboard.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
<span>Overview</span>
</a>
<a href="Containers.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: {{accent}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
<span>Containers</span>
</a>
<a href="Stacks.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
<span>Stacks</span>
</a>
<a href="Images.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12c0 1.700 3.600 3 8 3s8-1.300 8-3"></path></svg>
<span>Resources</span>
</a>
<a href="Main.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg>
<span>Servers</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent ?? '#5BE3B0';
var filter = (this.state && this.state.filter) || 'all';
var G = '#5BE3B0', A = '#F2B45A', R = '#FF8A7D';
var all = [
{ name: 'nginx-proxy', image: 'nginx:1.27', state: 'Up 12 days', meta: '0.4% · 38 MB', color: G, group: 'running' },
{ name: 'api-gateway', image: 'registry.example.com/api:2.8.1', state: 'Healthy', meta: '18% · 412 MB', color: G, group: 'running' },
{ name: 'worker-queue', image: 'registry.example.com/worker:2.8.1', state: 'Restarting', meta: '4 restarts', color: A, group: 'running' },
{ name: 'postgres-main', image: 'postgres:16', state: 'Healthy', meta: '6% · 1.9 GB', color: G, group: 'running' },
{ name: 'redis-cache', image: 'redis:7.2', state: 'Up 12 days', meta: '1% · 96 MB', color: G, group: 'running' },
{ name: 'grafana', image: 'grafana/grafana:11.1', state: 'Up 8 days', meta: '2% · 210 MB', color: G, group: 'running' },
{ name: 'postgres-backup', image: 'registry.example.com/pg-backup:1.3', state: 'Exited (1)', meta: '12 min ago', color: R, group: 'stopped' }
];
var shown = all.filter(function (r) { return filter === 'all' || r.group === filter; });
var rows = shown.map(function (r, i) {
var running = r.group === 'running';
return Object.assign({}, r, {
isRunning: running,
isStopped: !running,
actionLabel: (running ? 'Stop ' : 'Start ') + r.name,
divider: i === shown.length - 1 ? 'transparent' : '#243036'
});
});
var self = this;
var chips = [
{ id: 'all', label: 'All 16' },
{ id: 'running', label: 'Running 14' },
{ id: 'stopped', label: 'Stopped 2' }
].map(function (c) {
var on = c.id === filter;
return {
label: c.label,
pressed: on ? 'true' : 'false',
bg: on ? accent : '#161E22',
fg: on ? '#0E1417' : '#E8EEF0',
border: on ? accent : '#2A363C',
pick: function () { self.setState({ filter: c.id }); }
};
});
return { accent: accent, chips: chips, rows: rows };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm stop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E1417; color: #E8EEF0; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px;">
<dc-import name="ContainerDetail" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(4, 7, 9, 0.72);"></div>

<section role="dialog" aria-modal="true" aria-labelledby="cs-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; border-radius: 28px 28px 0 0; background: #161E22; border-top: 1px solid #2A363C;">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4A52;"></div>

<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #3A1C19; color: #FF8A7D;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 id="cs-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.3px;">Stop api-gateway?</h1>
<div style="font-size: 13px; color: #9AAAB1;">prod-eu-1 · web-platform</div>
</div>
</div>

<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C9D6DB;">The container gets SIGTERM, then SIGKILL after 10 s. Port 8080 stops answering, and 2 containers in web-platform depend on it.</p>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: #0A0F11; border: 1px solid #243036;">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AAAB1;">Request sent to the agent</div>
<code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #C9D6DB; word-break: break-all;">POST /v1/containers/4f2a9c1e7b3d/stop?timeout=10</code>
</div>

<div style="display: flex; align-items: center; gap: 12px; min-height: 44px;">
<label for="cs-bio" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.4;"><span>Confirm with fingerprint</span><span style="font-size: 12px; color: #9AAAB1;">This agent requires it for risky actions</span></label>
<button id="cs-bio" type="button" role="switch" aria-checked="true" style="flex-shrink: 0; position: relative; width: 46px; height: 28px; padding: 0; border-radius: 14px; border: 0; background: {{accent}};"><span style="position: absolute; top: 3px; left: 21px; width: 22px; height: 22px; border-radius: 11px; background: #0E1417;"></span></button>
</div>

<div style="display: flex; gap: 10px;">
<a href="ContainerDetail.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 54px; box-sizing: border-box; border-radius: 16px; border: 1px solid #3A4A52; color: #E8EEF0; font-size: 16px; font-weight: 600;">Cancel</a>
<button type="button" style="flex: 1 1 0; height: 54px; border-radius: 16px; background: #FF8A7D; border: 0; color: #1A0B09; font-size: 16px; font-weight: 600;">Stop container</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5BE3B0' };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server settings</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #0E1417; color: #E8EEF0;">
<a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: flex-start; color: #9AAAB1; font-size: 15px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
<span>Overview</span>
</a>

<header style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Server settings</h1>
<div style="font-size: 13px; color: #9AAAB1;">prod-eu-1</div>
</header>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #161E22; border: 1px solid #4A3B17;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 15px; font-weight: 600;">Agent 1.4.2</div>
<div style="font-size: 13px; color: #F2B45A;">Version 1.5.0 is available</div>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; background: {{accent}}; border: 0; color: #0E1417; font-size: 14px; font-weight: 600;">Update agent</button>
</div>

<dl style="margin: 0; display: flex; flex-direction: column; border-radius: 20px; background: #161E22; border: 1px solid #243036; padding: 0 16px;">
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #243036;">
<dt style="flex-grow: 1; font-size: 14px; color: #9AAAB1;">Agent URL</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">agent.example.com:8443</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #243036;">
<dt style="flex-grow: 1; font-size: 14px; color: #9AAAB1;">Certificate</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">Pinned · 9F:2C…A1:7E</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px;">
<dt style="flex-grow: 1; font-size: 14px; color: #9AAAB1;">Your role</dt>
<dd style="margin: 0; font-size: 14px;">Admin</dd>
</div>
</dl>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #161E22; border: 1px solid #243036; padding: 0 16px;">
<a href="Registries.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #243036; color: #E8EEF0; font-size: 14px;">
<span style="flex-grow: 1;">Registry credentials</span>
<span style="color: #9AAAB1;">2 signed in</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AAAB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</a>
<a href="Alerts.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #243036; color: #E8EEF0; font-size: 14px;">
<span style="flex-grow: 1;">Alert rules</span>
<span style="color: #9AAAB1;">4 active</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AAAB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</a>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #243036; color: #E8EEF0; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Paired devices</span>
<span style="color: #9AAAB1;">3 phones</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AAAB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; color: #E8EEF0; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Activity log</span>
<span style="color: #9AAAB1;">Who did what, and when</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AAAB1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #161E22; border: 1px solid #243036; padding: 0 16px;">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #243036;">
<label for="set-1" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px;">
<span>Fingerprint before risky actions</span>
<span style="font-size: 12px; color: #9AAAB1;">Stop, remove, prune and stack down</span>
</label>
<button id="set-1" type="button" role="switch" aria-checked="true" style="flex-shrink: 0; position: relative; width: 46px; height: 28px; padding: 0; border-radius: 14px; border: 0; background: {{accent}};"><span style="position: absolute; top: 3px; left: 21px; width: 22px; height: 22px; border-radius: 11px; background: #0E1417;"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px;">
<label for="set-2" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px;">
<span>Read-only on this phone</span>
<span style="font-size: 12px; color: #9AAAB1;">Sets this device to the viewer role on the agent</span>
</label>
<button id="set-2" type="button" role="switch" aria-checked="false" style="flex-shrink: 0; position: relative; width: 46px; height: 28px; padding: 0; border-radius: 14px; border: 0; background: #2A363C;"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #9AAAB1;"></span></button>
</div>
</div>

<div style="flex-grow: 1;"></div>

<button type="button" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 16px; background: transparent; border: 1px solid #4A2521; color: #FF8A7D; font-size: 15px; font-weight: 600;">Unpair this server</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5BE3B0' };
}
}
</script>
</body>
</html>

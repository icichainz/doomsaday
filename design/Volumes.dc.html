<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Volumes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1417; color: #E8EEF0;">
<main style="flex-grow: 1; box-sizing: border-box; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px;">
<header style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Volumes</h1>
<div style="font-size: 13px; color: #9AAAB1;">9 volumes · 46 GB · 2 not mounted</div>
</header>

<div role="group" aria-label="Resource type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #161E22; border: 1px solid #243036;">
<a href="Images.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; color: #9AAAB1; font-size: 14px; font-weight: 600;">Images</a>
<a href="Volumes.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #2A363C; color: #E8EEF0; font-size: 14px; font-weight: 600;">Volumes</a>
<a href="Networks.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; color: #9AAAB1; font-size: 14px; font-weight: 600;">Networks</a>
</div>

<div style="display: flex; gap: 8px;">
<button type="button" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; background: {{accent}}; border: 0; color: #0E1417; font-size: 15px; font-weight: 600;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Create volume</span>
</button>
<button type="button" style="height: 48px; padding: 0 16px; border-radius: 14px; background: transparent; border: 1px solid #3A4A52; color: #E8EEF0; font-size: 15px; font-weight: 600;">Prune unused</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #161E22; border: 1px solid #243036; padding: 0 6px 0 16px;">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 8px; min-height: 64px; border-bottom: 1px solid {{row.divider}};">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.name}}</div>
<div style="font-size: 12px; color: #9AAAB1;">{{row.meta}}</div>
</div>
<span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{row.pillBg}}; color: {{row.pillFg}}; font-size: 12px; font-weight: 600;">{{row.pill}}</span>
<button type="button" aria-label="{{row.moreLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #9AAAB1;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg>
</button>
</div>
</sc-for>
</div>
</main>

<nav aria-label="Primary" style="display: flex; height: 76px; box-sizing: border-box; padding: 8px 6px 12px; background: #121A1E; border-top: 1px solid #243036;">
<a href="Dashboard.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
<span>Overview</span>
</a>
<a href="Containers.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
<span>Containers</span>
</a>
<a href="Stacks.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
<span>Stacks</span>
</a>
<a href="Images.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: {{accent}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12c0 1.700 3.600 3 8 3s8-1.300 8-3"></path></svg>
<span>Resources</span>
</a>
<a href="Main.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #9AAAB1;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg>
<span>Servers</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent ?? '#5BE3B0';
var USED = { bg: '#15302A', fg: '#5BE3B0' }, IDLE = { bg: '#33290F', fg: '#F2B45A' };
var data = [
{ name: 'web-platform_pgdata', meta: '31 GB · local · postgres-main', pill: 'Mounted', used: true },
{ name: 'web-platform_redis', meta: '1.2 GB · local · redis-cache', pill: 'Mounted', used: true },
{ name: 'monitoring_prometheus', meta: '9.8 GB · local · prometheus', pill: 'Mounted', used: true },
{ name: 'monitoring_grafana', meta: '640 MB · local · grafana', pill: 'Mounted', used: true },
{ name: 'backups_dumps', meta: '3.1 GB · local · last used 12 min ago', pill: 'Not mounted', used: false },
{ name: 'old_uploads', meta: '210 MB · local · last used in March', pill: 'Not mounted', used: false }
];
var rows = data.map(function (r, i) {
var tone = r.used ? USED : IDLE;
return { name: r.name, meta: r.meta, pill: r.pill, pillBg: tone.bg, pillFg: tone.fg, moreLabel: 'Actions for volume ' + r.name, divider: i === data.length - 1 ? 'transparent' : '#243036' };
});
return { accent: accent, rows: rows };
}
}
</script>
</body>
</html>

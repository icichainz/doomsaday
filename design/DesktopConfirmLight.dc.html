<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop confirm by typing, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F3F5F4; color: #15201E; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px;">
<dc-import name="DesktopContainersLight" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(21, 32, 30, 0.45);"></div>
<section role="dialog" aria-modal="true" aria-labelledby="dc-title" style="position: absolute; left: 470px; top: 210px; width: 500px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #CFD8D6;">
<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #FCE1DD; color: #B3261E;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 id="dc-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Stop api-gateway?</h1>
<div style="font-size: 13px; color: #55656B;">prod-eu-1 · production</div>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #2B3A3F;">The container gets SIGTERM, then SIGKILL after 10 s. Port 8080 stops answering, and 2 containers in web-platform depend on it.</p>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #E9EEEC; border: 1px solid #DCE3E1;">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #55656B;">Request sent to the agent</div>
<code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #2B3A3F;">POST /v1/containers/4f2a9c1e7b3d/stop?timeout=10</code>
<code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #2B3A3F;">X-Confirmed: typed</code>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="dc-name" style="font-size: 13px; color: #2B3A3F;">This Mac has no Touch ID. Type <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: #15201E;">api-gateway</span> to confirm.</label>
<input id="dc-name" type="text" autocomplete="off" spellcheck="false" placeholder="api-gateway" onChange="{{onType}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #F3F5F4; border: 1px solid {{inputBorder}}; outline: none; color: #15201E; font-family: 'IBM Plex Mono', monospace; font-size: 14px;">
<div style="font-size: 12px; color: #55656B;">{{hint}}</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px;">
<a href="DesktopContainersLight.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 10px; border: 1px solid #B5C2BF; color: #15201E; font-size: 14px; font-weight: 600;">Cancel</a>
<button type="button" disabled="{{locked}}" style="height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: {{btnBg}}; color: {{btnFg}}; font-size: 14px; font-weight: 600;">Stop container</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var typed = (this.state && this.state.typed) || '';
var ok = typed.trim() === 'api-gateway';
return {
accent: this.props.accent ?? '#0B7A5C',
onType: function (e) { self.setState({ typed: e.target.value }); },
locked: !ok,
inputBorder: ok ? '#0B7A5C' : '#B5C2BF',
btnBg: ok ? '#B3261E' : '#FCE1DD',
btnFg: ok ? '#FFFFFF' : '#B3261E',
hint: ok ? 'Name matches. Press Return to stop the container.' : 'The button unlocks when the name matches exactly.'
};
}
}
</script>
</body>
</html>

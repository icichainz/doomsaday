<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Container logs (light)</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F3F5F4; color: #15201E; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px;">
<dc-import name="DesktopResourcesLight" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(21, 32, 30, 0.45);"></div>
<section role="dialog" aria-modal="true" aria-labelledby="dj-title" style="position: absolute; left: 470px; top: 278px; width: 500px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #CFD8D6;">
<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #D9F2E8; color: {{accent}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 id="dj-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Pulling redis:7.2</h1>
<div style="font-size: 13px; color: #55656B;">prod-eu-1 · Running on the agent</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<div role="progressbar" aria-valuenow="46" aria-valuemin="0" aria-valuemax="100" aria-label="Progress" style="height: 6px; border-radius: 3px; background: #DCE3E1;"><div style="width: 46%; height: 6px; border-radius: 3px; background: {{accent}};"></div></div>
<div style="display: flex; align-items: center; font-size: 12px; color: #55656B;">
<span style="flex-grow: 1;">46%</span>
<span style="font-family: 'IBM Plex Mono', monospace;">0:14 elapsed</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; min-height: 96px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #E9EEEC; border: 1px solid #E4E9E8; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #2B3A3F;">
<div>7.2: Pulling from library/redis</div>

<div>5b1e2c5d7a0f: Pull complete</div>
<div>c3f1b7e9d2a4: Downloading 18.2 / 41.6 MB</div>

<div style="display: flex; justify-content: flex-end; gap: 10px;">
<button type="button" style="height: 40px; padding: 0 18px; border-radius: 10px; background: transparent; border: 1px solid #B5C2BF; color: #15201E; font-size: 14px; font-weight: 600;">Cancel</button>
<a href="DesktopResources.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600;">Run in background</a>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7A5C' };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Images, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F4; color: #15201E;">
<main style="flex-grow: 1; box-sizing: border-box; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px;">
<header style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Images</h1>
<div style="font-size: 13px; color: #55656B;">6 images · 1.9 GB · 597 MB unused</div>
</header>

<div role="group" aria-label="Resource type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1;">
<a href="ImagesLight.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #CFD8D6; color: #15201E; font-size: 14px; font-weight: 600;">Images</a>
<a href="VolumesLight.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; color: #55656B; font-size: 14px; font-weight: 600;">Volumes</a>
<a href="NetworksLight.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; color: #55656B; font-size: 14px; font-weight: 600;">Networks</a>
</div>

<div style="display: flex; gap: 8px;">
<button type="button" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 14px; background: {{accent}}; border: 0; color: #FFFFFF; font-size: 15px; font-weight: 600;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Pull image</span>
</button>
<button type="button" style="height: 48px; padding: 0 16px; border-radius: 14px; background: transparent; border: 1px solid #B5C2BF; color: #15201E; font-size: 15px; font-weight: 600;">Prune unused</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 6px 0 16px;">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 8px; min-height: 64px; border-bottom: 1px solid {{row.divider}};">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.name}}</div>
<div style="font-size: 12px; color: #55656B;">{{row.meta}}</div>
</div>
<span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{row.pillBg}}; color: {{row.pillFg}}; font-size: 12px; font-weight: 600;">{{row.pill}}</span>
<button type="button" aria-label="{{row.moreLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #55656B;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg>
</button>
</div>
</sc-for>
</div>
</main>

<nav aria-label="Primary" style="display: flex; height: 76px; box-sizing: border-box; padding: 8px 6px 12px; background: #FFFFFF; border-top: 1px solid #DCE3E1;">
<a href="DashboardLight.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55656B;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
<span>Overview</span>
</a>
<a href="ContainersLight.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55656B;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
<span>Containers</span>
</a>
<a href="StacksLight.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55656B;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
<span>Stacks</span>
</a>
<a href="ImagesLight.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: {{accent}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12c0 1.700 3.600 3 8 3s8-1.300 8-3"></path></svg>
<span>Resources</span>
</a>
<a href="MainLight.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55656B;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg>
<span>Servers</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent ?? '#0B7A5C';
var USED = { bg: '#D9F2E8', fg: '#0B7A5C' }, IDLE = { bg: '#FBEBC8', fg: '#8A5200' };
var data = [
{ name: 'registry.example.com/api:2.8.1', meta: '412 MB · pulled 3 days ago', pill: 'In use', used: true },
{ name: 'registry.example.com/api:2.7.4', meta: '409 MB · pulled 3 weeks ago', pill: 'Unused', used: false },
{ name: 'registry.example.com/worker:2.8.1', meta: '388 MB · pulled 3 days ago', pill: 'In use', used: true },
{ name: 'postgres:16', meta: '431 MB · pulled 2 months ago', pill: 'In use', used: true },
{ name: 'redis:7.2', meta: '117 MB · pulled today 09:15', pill: 'In use', used: true },
{ name: 'nginx:1.25', meta: '188 MB · pulled 5 months ago', pill: 'Unused', used: false }
];
var rows = data.map(function (r, i) {
var tone = r.used ? USED : IDLE;
return { name: r.name, meta: r.meta, pill: r.pill, pillBg: tone.bg, pillFg: tone.fg, moreLabel: 'Actions for image ' + r.name, divider: i === data.length - 1 ? 'transparent' : '#DCE3E1' };
});
return { accent: accent, rows: rows };
}
}
</script>
</body>
</html>

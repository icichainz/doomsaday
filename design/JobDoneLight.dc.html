<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Container logs (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F5F4; color: #15201E; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px;">
<dc-import name="ImagesLight" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(21, 32, 30, 0.45);"></div>

<section role="dialog" aria-modal="true" aria-labelledby="jd-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; border-radius: 28px 28px 0 0; background: #FFFFFF; border-top: 1px solid #CFD8D6;">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #B5C2BF;"></div>

<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #D9F2E8; color: {{accent}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<h1 id="jd-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.3px;">Pulling redis:7.2</h1>
<div style="font-size: 13px; color: #55656B;">prod-eu-1 · Finished</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Progress" style="height: 6px; border-radius: 3px; background: #DCE3E1;"><div style="width: 100%; height: 6px; border-radius: 3px; background: {{accent}};"></div></div>
<div style="display: flex; align-items: center; font-size: 12px; color: #55656B;">
<span style="flex-grow: 1; color: {{accent}}; font-weight: 600;">Finished without errors</span>
<span style="font-family: 'IBM Plex Mono', monospace;">0:21 elapsed</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; min-height: 96px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #E9EEEC; border: 1px solid #E4E9E8; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #2B3A3F;">
<div>c3f1b7e9d2a4: Pull complete</div>
<div>e8d4a1f60b37: Pull complete</div>
<div>Digest: sha256:5a93f5c2…e41d</div>
<div>Status: Downloaded newer image for redis:7.2</div>
</div>

<a href="Images.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600;">Done</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7A5C' };
}
}
</script>
</body>
</html>

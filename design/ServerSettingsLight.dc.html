<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Server settings, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #F3F5F4; color: #15201E;">
<a href="DashboardLight.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: flex-start; color: #55656B; font-size: 15px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
<span>Overview</span>
</a>

<header style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Server settings</h1>
<div style="font-size: 13px; color: #55656B;">prod-eu-1</div>
</header>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E8CF94;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 15px; font-weight: 600;">Agent 1.4.2</div>
<div style="font-size: 13px; color: #8A5200;">Version 1.5.0 is available</div>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; background: {{accent}}; border: 0; color: #FFFFFF; font-size: 14px; font-weight: 600;">Update agent</button>
</div>

<dl style="margin: 0; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 16px;">
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Agent URL</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">agent.example.com:8443</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Certificate</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">Pinned · 9F:2C…A1:7E</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Your role</dt>
<dd style="margin: 0; font-size: 14px;">Admin</dd>
</div>
</dl>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 16px;">
<a href="RegistriesLight.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #DCE3E1; color: #15201E; font-size: 14px;">
<span style="flex-grow: 1;">Registry credentials</span>
<span style="color: #55656B;">2 signed in</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</a>
<a href="AlertsLight.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-bottom: 1px solid #DCE3E1; color: #15201E; font-size: 14px;">
<span style="flex-grow: 1;">Alert rules</span>
<span style="color: #55656B;">4 active</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</a>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #DCE3E1; color: #15201E; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Paired devices</span>
<span style="color: #55656B;">3 devices</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; color: #15201E; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Activity log</span>
<span style="color: #55656B;">Who did what, and when</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 16px;">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #DCE3E1;">
<label for="set-1" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px;">
<span>Fingerprint before risky actions</span>
<span style="font-size: 12px; color: #55656B;">Stop, remove, prune and stack down</span>
</label>
<button id="set-1" type="button" role="switch" aria-checked="true" style="flex-shrink: 0; position: relative; width: 46px; height: 28px; padding: 0; border-radius: 14px; border: 0; background: {{accent}};"><span style="position: absolute; top: 3px; left: 21px; width: 22px; height: 22px; border-radius: 11px; background: #F3F5F4;"></span></button>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px;">
<label for="set-2" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; font-size: 14px;">
<span>Read-only on this phone</span>
<span style="font-size: 12px; color: #55656B;">Viewer role on the agent</span>
</label>
<button id="set-2" type="button" role="switch" aria-checked="false" style="flex-shrink: 0; position: relative; width: 46px; height: 28px; padding: 0; border-radius: 14px; border: 0; background: #CFD8D6;"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #55656B;"></span></button>
</div>
</div>

<div style="flex-grow: 1;"></div>

<button type="button" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 16px; background: transparent; border: 1px solid #EBB5AE; color: #B3261E; font-size: 15px; font-weight: 600;">Unpair this server</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7A5C' };
}
}
</script>
</body>
</html>

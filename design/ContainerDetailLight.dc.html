<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Container detail, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px; background: #F3F5F4; color: #15201E; font-family: 'IBM Plex Sans', sans-serif;">
<a href="ContainersLight.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: flex-start; color: #55656B; font-size: 15px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
<span>Containers</span>
</a>

<header style="display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; align-items: center; gap: 10px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">api-gateway</h1>
<span style="padding: 4px 10px; border-radius: 999px; background: #D9F2E8; color: #0B7A5C; font-size: 12px; font-weight: 600;">Running · healthy</span>
</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55656B;">registry.example.com/api:2.8.1</div>
</header>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 72px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1; color: #15201E; font-size: 12px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
<span>Restart</span>
</button>
<a href="ConfirmStopLight.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 72px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1; color: #B3261E; font-size: 12px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
<span>Stop</span>
</a>
<a href="LogsLight.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 72px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1; color: #15201E; font-size: 12px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M5 12h14M5 18h9"></path></svg>
<span>Logs</span>
</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 72px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1; color: #15201E; font-size: 12px; font-weight: 600;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"></path></svg>
<span>Shell</span>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1;">
<div style="font-size: 12px; color: #55656B;">CPU</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; line-height: 1;">18%</div>
<div style="height: 5px; border-radius: 3px; background: #DCE3E1;"><div style="width: 18%; height: 5px; border-radius: 3px; background: {{accent}};"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1;">
<div style="font-size: 12px; color: #55656B;">Memory</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; line-height: 1;">412 <span style="font-size: 12px; font-weight: 500; color: #55656B;">MB</span></div>
<div style="height: 5px; border-radius: 3px; background: #DCE3E1;"><div style="width: 40%; height: 5px; border-radius: 3px; background: {{accent}};"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE3E1;">
<div style="font-size: 12px; color: #55656B;">Network</div>
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; line-height: 1;">1.2 <span style="font-size: 12px; font-weight: 500; color: #55656B;">MB/s</span></div>
<div style="font-size: 11px; line-height: 5px; color: #55656B;">in · 340 KB/s out</div>
</div>
</div>

<dl style="margin: 0; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 16px;">
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Ports</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">8080 → 8080/tcp</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Stack</dt>
<dd style="margin: 0; font-size: 14px;">web-platform</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Network</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">backend</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-bottom: 1px solid #DCE3E1;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Restart policy</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">unless-stopped</dd>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px;">
<dt style="flex-grow: 1; font-size: 14px; color: #55656B;">Container ID</dt>
<dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px;">4f2a9c1e7b3d</dd>
</div>
</dl>

<div style="display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1; padding: 0 16px;">
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #DCE3E1; color: #15201E; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Environment</span>
<span style="color: #55656B;">12 variables, values hidden</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0; background: transparent; border: 0; color: #15201E; font-size: 14px; text-align: left;">
<span style="flex-grow: 1;">Volumes</span>
<span style="color: #55656B;">2 mounts</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55656B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
</button>
</div>

<div style="flex-grow: 1;"></div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 16px; background: transparent; border: 1px solid #EBB5AE; color: #B3261E; font-size: 15px; font-weight: 600;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"></path></svg>
<span>Remove container</span>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7A5C' };
}
}
</script>
</body>
</html>

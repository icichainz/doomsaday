<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E1417; color: #E8EEF0; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px;">
<dc-import name="Devices" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(4, 7, 9, 0.72);"></div>

<section role="dialog" aria-modal="true" aria-labelledby="da-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; border-radius: 28px 28px 0 0; background: #161E22; border-top: 1px solid #2A363C;">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4A52;"></div>

<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #1A2429; color: #E8EEF0;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"></rect><path d="M11 18h2"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 id="da-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.3px;">This phone</h1>
<div style="font-size: 13px; color: #9AAAB1;">This device · last seen just now</div>
</div>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
<legend style="padding: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AAAB1;">Role</legend>
<div role="radiogroup" aria-label="Role for This phone" style="display: flex; flex-direction: column; padding: 0 14px; border-radius: 16px; border: 1px solid #243036;">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #243036; color: #E8EEF0; text-align: left;">
<span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid {{accent}}; display: flex; align-items: center; justify-content: center;"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{accent}};"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Admin</span><span style="font-size: 12px; color: #9AAAB1;">Everything, including shell, environment values and devices</span></span>
</button>
<button type="button" role="radio" aria-checked="false" aria-disabled="true" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #243036; color: #E8EEF0; text-align: left; opacity: 0.45;">
<span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #3A4A52;"></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Operator</span><span style="font-size: 12px; color: #9AAAB1;">Start, stop, restart, pull and redeploy</span></span>
</button>
<button type="button" role="radio" aria-checked="false" aria-disabled="true" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0; background: transparent; border: 0; color: #E8EEF0; text-align: left; opacity: 0.45;">
<span style="flex-shrink: 0; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 2px solid #3A4A52;"></span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Viewer</span><span style="font-size: 12px; color: #9AAAB1;">Read only</span></span>
</button>
</div>
</fieldset>

<div role="note" style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #33290F; border: 1px solid #4A3B17;">
<div style="flex-shrink: 0; color: #F2B45A;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="font-size: 14px; font-weight: 600; color: #F2B45A;">The only admin on prod-eu-1</div>
<div style="font-size: 13px; line-height: 1.45; color: #C9D6DB;">The agent refuses to demote or revoke the last admin (409). Make another device admin first.</div>
</div>
</div>

<div style="display: flex; gap: 10px;">
<a href="Devices.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 54px; box-sizing: border-box; border-radius: 16px; border: 1px solid #3A4A52; color: #E8EEF0; font-size: 16px; font-weight: 600;">Close</a>
<button type="button" disabled style="flex: 1 1 0; height: 54px; border-radius: 16px; background: transparent; border: 1px solid #3A4A52; color: #FF8A7D; font-size: 16px; font-weight: 600; opacity: 0.45;">Revoke device</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5BE3B0' };
}
}
</script>
</body>
</html>

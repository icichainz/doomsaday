<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Container logs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E1417; color: #E8EEF0; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px;">
<dc-import name="Images" accent="{{accent}}" hint-size="390px,844px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(4, 7, 9, 0.72);"></div>

<section role="dialog" aria-modal="true" aria-labelledby="js-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; border-radius: 28px 28px 0 0; background: #161E22; border-top: 1px solid #2A363C;">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #3A4A52;"></div>

<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #15302A; color: {{accent}};">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<h1 id="js-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.3px;">Pulling redis:7.2</h1>
<div style="font-size: 13px; color: #9AAAB1;">prod-eu-1 · Running on the agent</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div role="progressbar" aria-valuenow="46" aria-valuemin="0" aria-valuemax="100" aria-label="Progress" style="height: 6px; border-radius: 3px; background: #243036;"><div style="width: 46%; height: 6px; border-radius: 3px; background: {{accent}};"></div></div>
<div style="display: flex; align-items: center; font-size: 12px; color: #9AAAB1;">
<span style="flex-grow: 1;">46%</span>
<span style="font-family: 'IBM Plex Mono', monospace;">0:14 elapsed</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; min-height: 96px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; background: #0A0F11; border: 1px solid #1E282D; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5; color: #C9D6DB;">
<div>7.2: Pulling from library/redis</div>
<div>a2318d6c47ec: Pull complete</div>
<div>5b1e2c5d7a0f: Pull complete</div>
<div>c3f1b7e9d2a4: Downloading 18.2 / 41.6 MB</div>
<div>e8d4a1f60b37: Waiting</div>
</div>

<div style="display: flex; gap: 10px;">
<button type="button" style="flex: 1 1 0; height: 54px; border-radius: 16px; background: transparent; border: 1px solid #3A4A52; color: #E8EEF0; font-size: 16px; font-weight: 600;">Cancel</button>
<a href="Images.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: {{accent}}; color: #0E1417; font-size: 16px; font-weight: 600;">Run in background</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5BE3B0' };
}
}
</script>
</body>
</html>

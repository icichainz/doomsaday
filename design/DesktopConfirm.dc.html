<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop confirm by typing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0E1417; color: #E8EEF0; font-family: 'IBM Plex Sans', sans-serif;">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px;">
<dc-import name="DesktopContainers" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
</div>
<div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: rgba(4, 7, 9, 0.72);"></div>
<section role="dialog" aria-modal="true" aria-labelledby="dc-title" style="position: absolute; left: 470px; top: 210px; width: 500px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; border-radius: 20px; background: #161E22; border: 1px solid #2A363C;">
<div style="display: flex; align-items: center; gap: 14px;">
<div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #3A1C19; color: #FF8A7D;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h1 id="dc-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.3px;">Stop api-gateway?</h1>
<div style="font-size: 13px; color: #9AAAB1;">prod-eu-1 · production</div>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C9D6DB;">The container gets SIGTERM, then SIGKILL after 10 s. Port 8080 stops answering, and 2 containers in web-platform depend on it.</p>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #0A0F11; border: 1px solid #243036;">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #9AAAB1;">Request sent to the agent</div>
<code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #C9D6DB;">POST /v1/containers/4f2a9c1e7b3d/stop?timeout=10</code>
<code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; color: #C9D6DB;">X-Confirmed: typed</code>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="dc-name" style="font-size: 13px; color: #C9D6DB;">This Mac has no Touch ID. Type <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: #E8EEF0;">api-gateway</span> to confirm.</label>
<input id="dc-name" type="text" autocomplete="off" spellcheck="false" placeholder="api-gateway" onChange="{{onType}}" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #0E1417; border: 1px solid {{inputBorder}}; outline: none; color: #E8EEF0; font-family: 'IBM Plex Mono', monospace; font-size: 14px;">
<div style="font-size: 12px; color: #9AAAB1;">{{hint}}</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px;">
<a href="DesktopContainers.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; box-sizing: border-box; padding: 0 18px; border-radius: 10px; border: 1px solid #3A4A52; color: #E8EEF0; font-size: 14px; font-weight: 600;">Cancel</a>
<button type="button" disabled="{{locked}}" style="height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: {{btnBg}}; color: {{btnFg}}; font-size: 14px; font-weight: 600;">Stop container</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var typed = (this.state && this.state.typed) || '';
var ok = typed.trim() === 'api-gateway';
return {
accent: this.props.accent ?? '#5BE3B0',
onType: function (e) { self.setState({ typed: e.target.value }); },
locked: !ok,
inputBorder: ok ? '#5BE3B0' : '#3A4A52',
btnBg: ok ? '#FF8A7D' : '#3A1C19',
btnFg: ok ? '#1A0B09' : '#FF8A7D',
hint: ok ? 'Name matches. Press Return to stop the container.' : 'The button unlocks when the name matches exactly.'
};
}
}
</script>
</body>
</html>

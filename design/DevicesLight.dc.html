<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paired devices, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#F3F5F4;color:#15201E}
a{color:#0B7A5C;text-decoration:none}a:hover{color:#075E46}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 14px; background: #F3F5F4; color: #15201E;">
<a href="ServerSettingsLight.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; align-self: flex-start; color: #55656B; font-size: 15px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
<span>Settings</span>
</a>

<header style="display: flex; flex-direction: column; gap: 2px;">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px;">Paired devices</h1>
<div style="font-size: 13px; color: #55656B;">3 devices hold a key for prod-eu-1</div>
</header>

<ul style="margin: 0; padding: 0 6px 0 16px; list-style: none; display: flex; flex-direction: column; border-radius: 20px; background: #FFFFFF; border: 1px solid #DCE3E1;">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 8px; min-height: 66px; border-bottom: 1px solid {{row.divider}};">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.name}}</span>
<span style="font-size: 13px; color: #55656B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><sc-if value="{{row.self}}" hint-placeholder-val="{{ true }}"><span style="font-weight: 600; color: {{accent}};">This device · </span></sc-if>{{row.meta}}</span>
</span>
<span style="flex-shrink: 0; padding: 4px 10px; border-radius: 999px; background: {{row.pillBg}}; color: {{row.pillFg}}; font-size: 12px; font-weight: 600;">{{row.role}}</span>
<a href="DeviceActionsLight.dc.html" aria-label="{{row.actionLabel}}" style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #55656B;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg>
</a>
</li>
</sc-for>
</ul>

<div style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: #EAF0EE; border: 1px solid #DCE3E1;">
<div style="flex-shrink: 0; color: #0B7A5C;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.500-3.200 8-8 9-4.800-1-8-4.500-8-9V6z"></path></svg>
</div>
<div style="font-size: 13px; line-height: 1.45; color: #55656B;">The first device to pair is admin and every later one is an operator. The last admin can't be demoted or revoked, so the host is never locked out of its own agent.</div>
</div>

<div style="flex-grow: 1;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A5C","options":["#0B7A5C","#1F5FBF","#8A5200"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var all = [
{ name: 'This phone', meta: 'last seen just now', role: 'Admin', self: true },
{ name: 'Ops iPad', meta: 'Last seen 1 day ago · push on', role: 'Operator', self: false },
{ name: 'On-call pixel', meta: 'Last seen 3 days ago', role: 'Viewer', self: false }
];
var rows = all.map(function (r, i) {
var admin = r.role === 'Admin';
return Object.assign({}, r, {
pillBg: admin ? '#D9F2E8' : '#E4E9E8',
pillFg: admin ? '#0B7A5C' : '#15201E',
actionLabel: 'Actions for ' + r.name,
divider: i === all.length - 1 ? 'transparent' : '#DCE3E1'
});
});
return { accent: this.props.accent ?? '#0B7A5C', rows: rows };
}
}
</script>
</body>
</html>

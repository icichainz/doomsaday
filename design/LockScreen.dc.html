<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Container logs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:#0E1417;color:#E8EEF0}
a{color:#5BE3B0;text-decoration:none}a:hover{color:#8FF0CB}
button,input{font-family:inherit}
</style>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0E1417; color: #E8EEF0; text-align: center;">
<div role="img" aria-label="Doomsaday" style="width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #0E1417; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 700;">D</div>
<h1 style="margin: 22px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.3px;">Unlock Doomsaday</h1>
<p style="margin: 8px 0 0; max-width: 340px; font-size: 15px; line-height: 1.5; color: #9AAAB1;">Your servers stay out of sight until you unlock.</p>
<button type="button" style="align-self: stretch; margin-top: 28px; height: 56px; border-radius: 18px; border: 0; background: {{accent}}; color: #0E1417; font-size: 16px; font-weight: 600;">Unlock with fingerprint or face</button>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5BE3B0","options":["#5BE3B0","#6CB8FF","#F2B45A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#5BE3B0' };
}
}
</script>
</body>
</html>
